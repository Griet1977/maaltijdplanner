<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#173b2a">
  <title>Aan tafel</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    /* V6.4: gebruikerskolom blijft zichtbaar bij horizontaal scrollen */
    .ptable th:first-child,
    .ptable td:first-child {
      position: sticky;
      left: 0;
      background: #fff;
      z-index: 4;
      box-shadow: 2px 0 0 #dbe2dc;
    }
    .ptable th:first-child { z-index: 5; }
    .ptable tr.v64-current-user td:first-child { color: #287a46; }
  </style>
</head>
<body>
  <div id="boot"><div class="center"><h1>🍽️ Aan tafel</h1><p>App laden…</p></div></div>
  <div id="auth" hidden></div>
  <div id="main" hidden>
    <header>
      <b>🍽️ Aan tafel</b>
      <span><i id="sync">Verbinden…</i><strong id="me"></strong><button id="logout">Afmelden</button></span>
    </header>
    <div class="shell"><nav id="nav"></nav><main id="app"></main></div>
  </div>
  <div id="toast"></div>
  <div id="modal"></div>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="app.js"></script>
  <script src="ux-v64.js"></script>
</body>
</html>
